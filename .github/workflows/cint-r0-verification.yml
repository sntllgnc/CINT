name: CINT R0 verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cint-r0-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verification-matrix:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26
          - windows-2025
        node:
          - "20"
          - "24"
          - "26"

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install the locked dependency graph
        run: npm ci

      - name: Verify all 13 registered and packaged schemas
        run: npm run schema:verify

      - name: Run the complete CINT and historical AF-G0 verification
        run: npm run verify

  remote-verification:
    name: CINT-R0 remote verification
    if: ${{ always() }}
    needs:
      - verification-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification lane
        env:
          MATRIX_RESULT: ${{ needs.verification-matrix.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "Verification matrix result: $MATRIX_RESULT" >&2
            exit 1
          fi
